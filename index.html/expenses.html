<!DOCTYPE html> 
  <html lang="en">
        <head>
                    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title> Expenses Tracker </title>

        <link rel="stylesheet" href="../CSS-practice/index.css">
        

      </head>
      <body> 
        <header>
          <h1> <span></span>Expenses Tracker</h1>
        </header>
        <h3>Keep the track of your expenses</h3>
        <div class="container">
          <div class="card">           
            <h2>no of expenses</h2>
            <p id="no-of-expenses">0</p>
            </div>
            <div class="card">
            <h2>total expenses</h2>
            <p id="total-expenses">Rs 0.00</p>
        </div>
        </div>
        <h2>Add expenses</h2>
        <form id="expense-form">
          <label for ="expense-name">expenses name:</label>
          <input type ="text" id="expense-name"placeholder="enter expenses name" required> 
          
          <label for="expenses-amount">expenses amount:</label>
          <input type="number" id="expenses-amount" placeholder="enter expenses amount" required>
          
            <label for ="expense-date">expenses date</label>
            <input type="date" id="expense-date" required>
          <label for="expenses-category">expenses category</label>

          <select id="expenses-category">
            <option value="food">food</option>
            <option value="transportation">transportation</option>
            <option value="entertainment">entertainment</option>
            <option value="education">education</option>
            <option value="other">other</option>
          </select>
          <button type="submit">Add expenses</button>
          <br>
          <h2>My expenses</h2>
                    <table>
            <thead>
              <tr>
                <th>Expense Name</th> 

                <th>Amount</th>

                <th>Date</th>

                <th>Category</th>
              </tr>
            </thead>
            <tbody>
              
            </tbody>
          </table>
      
        </form>
    
        <script src="../JS- practices/ccc.js"></script>
    
      </body>
</html>

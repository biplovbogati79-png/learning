<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="name">
        <label for="string">enter word:</label>
        <input tpye="text" id ="string">
        <br>
                <button type="submit">submit</button>
                <p id="rev"></p>
    </form>
    <script>
        const form=document.getElementById("name");
        const word1=document.getElementById("string");
        const reverse=document.getElementById("rev");
         form.addEventListener("submit",function(event){
            event.preventDefault();
            const word2 =word1.value
            let reversed="";
            for (let i = word2.length - 1; i >= 0; i--) {
    reversed += word2[i];
    reverse.innerHTML=reversed
    }



         });

    </script>
</body>

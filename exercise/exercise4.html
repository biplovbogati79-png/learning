<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>find the greatest number</title>
</head>
<body>
    <form id ="number">
        <label for="firstNumber">Enter first number</label>
        <input type="number" id ="firstNumber">
        <br>
        <label for="secondNumber">Enter second number</label>
        <input type="number" id ="secondNumber">
        <br>
        <button type="submit">check</button>
    </form>
    <script>
        const form = document.getElementById("number"); 
                const num1= document.getElementById("firstNumber");
        const num2=document.getElementById("secondNumber");
        form.addEventListener("submit", function(event){
            event.preventDefault();
            const number1=Number(num1.value);
            const number2=Number(num2.value);
            if (number1 === number2){
            alert("they are equal")}
            else if (number1>number2){
                alert("first is greatest")
            }
            else 
            {
                alert("second is greatest");
            }
        });

    </script>
</body>
</html>
